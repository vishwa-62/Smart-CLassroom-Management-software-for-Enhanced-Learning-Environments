version: '3.8'

services:
  database:
    image: mysql:8.0
    container_name: smart_classroom_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: smart_classroom
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql

  backend:
    build:
      context: ./backend
    container_name: smart_classroom_backend
    restart: always
    environment:
      PORT: 5001
      NODE_ENV: production
      DB_HOST: database
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: smart_classroom
      JWT_SECRET: smart_classroom_jwt_secret_key_2026_super_secure
      CORS_ORIGIN: "*"
    ports:
      - "5001:5001"
    depends_on:
      - database

  frontend:
    build:
      context: ./frontend
    container_name: smart_classroom_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data:
